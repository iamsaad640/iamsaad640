name: arcade

# Redraws the contribution-graph games once a day and publishes the SVGs to the `output` branch,
# which the profile README reads through raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/arcade.yml"]

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Runs first: snk is a Docker action and leaves dist/ owned by root, which a later Node step could not write to.
      - name: pac-man and breakout
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman,breakout

      - name: snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1f6f8a&color_dots=#ebedf0,#c4e5e1,#7fc4bd,#3ea3a6,#1f6f8a
            dist/snake-dark.svg?palette=github-dark&color_snake=#48b1b8&color_dots=#161b22,#17302d,#1f5452,#23706f,#48b1b8

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(arcade): redraw contribution games"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
